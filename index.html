<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07080b">
<title>Refraktor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#07080b;
  --ink:#ece8e1;
  --mute:#a39e96;
  --glass:rgba(13,15,21,.60);
  --glass-2:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.11);
  --line-2:rgba(255,255,255,.28);
  --sun:#f3c77b;
  --chip-on:#f4f1ec;
  --chip-on-ink:#101216;
  --spec:linear-gradient(90deg,#ff5f5f,#ffae4a,#ffe66b,#72f5a0,#5cc8ff,#9a72ff);
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font:14px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}
#vid{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}

.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1 1 auto}
.word{font-family:var(--serif);font-style:italic;font-size:31px;line-height:.9;letter-spacing:.005em;text-shadow:0 1px 20px rgba(0,0,0,.55)}
.meta{font:500 10.5px/1.2 var(--mono);color:var(--ink);opacity:.72;letter-spacing:.05em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.topr{flex:0 0 auto}
.topr{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--mute);font-weight:500;font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer}
.seg button.on{background:rgba(255,255,255,.15);color:var(--ink)}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--glass);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);cursor:pointer;padding:0}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.sheet{position:fixed;z-index:4;left:0;right:0;bottom:0;margin:0 auto;max-width:780px;background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:4px 8px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;flex:0 0 auto;background:none;border:0;color:var(--mute);font-weight:500;font-size:13.5px;padding:13px 12px 14px;cursor:pointer}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:7px;height:2px;border-radius:2px;background:var(--spec)}
.tabs .grip{margin-left:auto;color:var(--mute);padding:13px 10px}
.tabs .grip svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;transition:transform .25s}
.sheet.collapsed .tabs .grip svg{transform:rotate(180deg)}
.panes{max-height:min(36vh,340px);overflow-y:auto;padding:4px 16px 14px;border-top:1px solid var(--line);scrollbar-width:thin}
.sheet.collapsed .panes{display:none}
.pane{display:flex;flex-direction:column}
.group{display:flex;flex-direction:column;gap:9px;padding:11px 0 7px}
.glabel{font:500 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--glass-2);color:var(--ink);font-weight:500;font-size:13px;line-height:1;
  padding:9px 13px;border-radius:999px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.chip:hover{border-color:var(--line-2)}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
.chip small{font:500 10px var(--mono);opacity:.6;margin-left:6px;letter-spacing:.02em}
.ctl{display:flex;flex-direction:column;gap:2px;padding:6px 0 2px}
.ctl .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ctl label{font-size:13px;color:var(--ink)}
.val{font:500 11.5px var(--mono);font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer;--track:rgba(255,255,255,.2)}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--track)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-9px;box-shadow:0 1px 8px rgba(0,0,0,.55);border:0}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 8px rgba(0,0,0,.55);border:0}
input.t-time{--track:linear-gradient(90deg,#0b1130 0%,#232a5e 7%,#c86e5a 11%,#f3be78 15%,#b7cde0 26%,#8fbfee 50%,#b9d0e4 72%,#f1b066 82%,#d0604a 86.5%,#3b3674 91%,#0b1130 100%)}
input.t-spec{--track:linear-gradient(90deg,rgba(255,255,255,.25),#ff6060 22%,#ffc451 40%,#78f59e 58%,#5bc6ff 76%,#9d6bff 100%)}
input.t-ior{--track:linear-gradient(90deg,rgba(255,255,255,.12),rgba(160,220,255,.55) 20%,rgba(255,255,255,.85))}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:none;border:0;padding:10px 0;cursor:pointer;text-align:left;font-size:13px}
.toggle i{position:relative;flex:0 0 auto;width:40px;height:24px;border-radius:12px;background:rgba(255,255,255,.18);transition:background .2s}
.toggle i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle[aria-pressed="true"] i{background:#6fc3ff}
.toggle[aria-pressed="true"] i::after{transform:translateX(16px)}
.note{margin:6px 0 2px;font-size:12px;color:var(--mute);line-height:1.5;max-width:60ch}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 4px}
.btn{border:1px solid var(--line-2);background:rgba(255,255,255,.08);border-radius:12px;padding:10px 14px;font-weight:500;font-size:13px;cursor:pointer}
:focus-visible{outline:2px solid #8fd0ff;outline-offset:2px}

.shutter-row{position:fixed;z-index:3;left:0;right:0;bottom:calc(var(--sheetH,120px) + 18px);display:flex;justify-content:center;align-items:center;gap:30px;pointer-events:none}
.shutter-row>*{pointer-events:auto}
#shutter{width:70px;height:70px;border-radius:50%;border:4px solid rgba(255,255,255,.92);background:rgba(255,255,255,.18);cursor:pointer;
  box-shadow:0 2px 24px rgba(0,0,0,.35);transition:transform .12s}
#shutter:active{transform:scale(.92)}
.shutter-row .icon-btn{width:46px;height:46px}

.restore{position:fixed;z-index:6;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
body.noui .top,body.noui .sheet,body.noui .shutter-row{display:none}

.toast{position:fixed;z-index:7;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translate(-50%,-8px);max-width:min(90vw,440px);
  background:rgba(12,14,19,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;
  padding:10px 14px;font-size:13px;line-height:1.45;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.photo{position:fixed;inset:0;z-index:10;background:rgba(5,6,8,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.photo img{max-width:100%;max-height:70vh;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.photo .btnrow{justify-content:center}
.photo a.btn{text-decoration:none;color:var(--ink)}
.photo p{margin:0;color:var(--mute);font-size:12px;text-align:center;max-width:46ch}

.fail{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:15px;line-height:1.6;color:var(--ink);z-index:20;background:var(--bg)}
.fail pre{max-width:90vw;overflow:auto;text-align:left;font:11px var(--mono);color:var(--mute);white-space:pre-wrap}

@media (max-width:420px){
  .word{font-size:27px}
  .seg button{padding:8px 11px;font-size:12.5px}
}
@media (min-width:900px){
  .sheet{left:auto;right:16px;bottom:16px;margin:0;width:400px;border-radius:20px;border-bottom:1px solid var(--line);padding-bottom:0}
  .panes{max-height:min(62vh,560px)}
  .shutter-row{bottom:28px;right:432px}
}
@media (prefers-reduced-motion:reduce){
  .toast,.chip,.toggle i,.toggle i::after{transition:none}
}
</style>
</head>
<body>
<canvas id="gl" aria-label="Simulation der Lichtbrechung"></canvas>
<video id="vid" playsinline muted autoplay></video>

<header class="top">
  <div class="brand">
    <span class="word">Refraktor</span>
    <span class="meta" id="meta">n 1.620 · V 36 · 19:25</span>
  </div>
  <div class="topr">
    <div class="seg" role="tablist" aria-label="Modus">
      <button id="mAnim" class="on" role="tab" aria-selected="true">Animation</button>
      <button id="mCam" role="tab" aria-selected="false">Kamera</button>
    </div>
    <button class="icon-btn" id="hideUI" aria-label="Oberfläche ausblenden" title="Oberfläche ausblenden">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
</header>

<div class="shutter-row" id="shutterRow" hidden>
  <button class="icon-btn" id="loadImg" aria-label="Bild laden" title="Bild laden">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>
  </button>
  <button id="shutter" aria-label="Foto aufnehmen" title="Foto aufnehmen"></button>
  <button class="icon-btn" id="flip" aria-label="Kamera wechseln" title="Kamera wechseln">
    <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9.5 13.5a2.8 2.8 0 0 0 5 .9M14.5 12.5a2.8 2.8 0 0 0-5-.9"/><path d="M14.8 15l-.3-1.6 1.6-.2M9.2 10l.3 1.6-1.6.2"/></svg>
  </button>
</div>

<section class="sheet" id="sheet">
  <nav class="tabs" id="tabs" aria-label="Einstellungen"></nav>
  <div class="panes" id="panes"></div>
</section>

<button class="icon-btn restore" id="restore" hidden aria-label="Oberfläche einblenden" title="Oberfläche einblenden">
  <svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="photo" id="photo" hidden>
  <img id="photoImg" alt="Aufgenommenes Bild">
  <div class="btnrow">
    <button class="btn" id="sharePhoto">Teilen / Sichern</button>
    <a class="btn" id="dlPhoto" download="refraktor.jpg" href="#">Download</a>
    <button class="btn" id="closePhoto">Schließen</button>
  </div>
  <p>Auf dem iPhone: Bild lange drücken und „Zu Fotos hinzufügen“ wählen.</p>
</div>

<input type="file" id="file" accept="image/*" hidden>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const lerp3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const norm3 = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const lum = c => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];

function fail(msg, detail) {
  const d = document.createElement('div');
  d.className = 'fail';
  d.innerHTML = '<div><p>' + msg + '</p>' + (detail ? '<pre></pre>' : '') + '</div>';
  if (detail) d.querySelector('pre').textContent = detail;
  document.body.appendChild(d);
}

const canvas = $('#gl');
const gl = canvas.getContext('webgl2', {
  antialias: false, alpha: false, depth: false, stencil: false,
  preserveDrawingBuffer: true, powerPreference: 'high-performance'
});
if (!gl) { fail('Dieser Browser unterstützt kein WebGL2. Bitte Safari 15+ oder einen aktuellen Chrome/Firefox verwenden.'); return; }
gl.getExtension('EXT_color_buffer_float');
gl.getExtension('EXT_color_buffer_half_float');

/* ================================================================
   GLSL
   ================================================================ */
const HEAD = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
`;

const COMMON = `
#define PI 3.14159265359
uniform float uTime;
uniform vec3 uSunDir;
uniform vec3 uSunCol;
uniform vec3 uZenith;
uniform vec3 uHorizon;
uniform float uNight;
uniform float uDiskK;
uniform float uHalo;
uniform float uCloud;
uniform int uWave;
uniform float uWaveAmp;
uniform float uWaveSpeed;
uniform vec4 uRip[8];
uniform vec2 uSlosh;
uniform vec4 uSloshAx;
uniform float uSeed;
uniform float uBeam;
uniform float uBeamW;
float gStars = 1.0;

float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz)*p3.zy); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0 - 2.0*f);
  return mix(mix(hash12(i), hash12(i + vec2(1.0, 0.0)), u.x), mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), u.x), u.y);
}
float fbm(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++){ s += a*vnoise(p); p = p*2.03 + vec2(1.7, 9.2); a *= 0.5; } return s; }
float fres(float c, float ior){ float r0 = (ior - 1.0)/(ior + 1.0); r0 *= r0; float x = 1.0 - clamp(c, 0.0, 1.0); return r0 + (1.0 - r0)*x*x*x*x*x; }

vec3 skyBase(vec3 d){
  if (uBeam > 0.5) return mix(vec3(0.002, 0.002, 0.0025), vec3(0.018, 0.018, 0.022), smoothstep(-0.2, 0.9, d.y));
  float y = d.y;
  float hy = max(y, 0.0);
  vec3 col = mix(uHorizon, uZenith, pow(hy, 0.36));
  vec2 sh = normalize(uSunDir.xz + vec2(1e-5));
  vec2 dh = normalize(d.xz + vec2(1e-5));
  float az = max(dot(dh, sh), 0.0);
  col += uSunCol*0.07*pow(az, 4.0)*exp(-hy*7.0)*uHalo;
  float sd = max(dot(d, uSunDir), 0.0);
  col += uSunCol*(0.035*pow(sd, 5.0) + 0.28*pow(sd, 80.0))*uHalo;
  if (y < 0.0) col = mix(col, uHorizon*0.5, 1.0 - exp(y*5.0));
  return col;
}
vec3 fogCol(vec3 rd){ return skyBase(normalize(vec3(rd.x + 1e-5, 0.0, rd.z))); }

vec3 skyCol(vec3 d, float disk){
  vec3 col = skyBase(d);
  if (uBeam > 0.5) return col;
  float y = d.y;
  float sd = dot(d, uSunDir);
  if (y > 0.0 && uNight*gStars > 0.001){
    vec2 sp = vec2(atan(d.z, d.x), asin(clamp(y, -1.0, 1.0)))*95.0;
    vec2 id = floor(sp); vec2 f = fract(sp) - 0.5;
    float h = hash12(id);
    if (h > 0.982){
      vec2 o = hash22(id) - 0.5;
      float st = smoothstep(0.16, 0.0, length(f - o*0.6));
      col += mix(vec3(1.0, 0.85, 0.7), vec3(0.75, 0.85, 1.0), hash12(id + 3.1))*st*uNight*gStars*(h - 0.982)*110.0*(0.75 + 0.25*sin(uTime*2.7 + h*90.0));
    }
  }
  col += uSunCol*smoothstep(0.99955, 0.99985, sd)*uDiskK*disk;
  if (y > 0.0 && uCloud > 0.001){
    vec2 cp = d.xz/(y + 0.1)*0.85 + vec2(uTime*0.006, uTime*0.0025);
    float f = fbm(cp*1.25);
    float cov = smoothstep(0.62 - uCloud*0.28, 0.9 - uCloud*0.2, f)*smoothstep(0.0, 0.16, y);
    float s01 = sd*0.5 + 0.5;
    vec3 base = uHorizon*0.62 + uZenith*0.35;
    vec3 cc = base + uSunCol*0.26*(0.25 + 0.75*pow(s01, 3.0)) + uSunCol*0.5*pow(max(sd, 0.0), 24.0)*(1.0 - cov);
    col = mix(col, cc, cov*0.85);
  }
  return col;
}

float seaOct(vec2 uv, float ch){
  uv += vnoise(uv);
  vec2 wv = 1.0 - abs(sin(uv));
  vec2 swv = abs(cos(uv));
  wv = mix(wv, swv, wv);
  return pow(1.0 - pow(wv.x*wv.y, 0.65), ch);
}
float rainH(vec2 p, float t){
  float h = 0.0;
  for (int s = 0; s < 2; s++){
    float sc = s == 0 ? 1.5 : 2.6;
    vec2 q = p*sc + float(s)*17.0;
    vec2 id = floor(q);
    for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
      vec2 c = id + vec2(float(i), float(j));
      vec2 r = hash22(c);
      float per = 1.2 + r.x*1.6;
      float tt = t + r.y*per*7.0;
      float age = mod(tt, per);
      vec2 pos = c + 0.15 + 0.7*hash22(c + floor(tt/per)*3.1);
      float d = length(q - pos);
      float x = d - age*0.9;
      h += sin(x*24.0)*exp(-x*x*40.0)*exp(-age*2.4)/(1.0 + d*4.0);
    }
  }
  return h*0.022;
}
float tapRip(vec2 p){
  float h = 0.0;
  for (int i = 0; i < 8; i++){
    vec4 r = uRip[i];
    if (r.w <= 0.0) continue;
    float age = uTime - r.z;
    if (age < 0.0) continue;
    float d = length(p - r.xy);
    float x = d - age*1.35;
    h += r.w*sin(x*9.0)*exp(-x*x*2.2)*exp(-age*0.45)/(1.0 + d*1.2);
  }
  return h*0.07;
}
float waveH(vec2 p){
  float t = uTime*uWaveSpeed;
  float h = 0.0;
  if (uWave == 0){
    h = 0.004*(sin(dot(p, vec2(3.1, 1.7)) + t*2.0) + sin(dot(p, vec2(-2.3, 3.3)) + t*2.6));
  } else if (uWave == 1){
    h = 0.12*sin(dot(p, vec2(0.42, 0.18)) - t*0.9) + 0.07*sin(dot(p, vec2(-0.28, 0.52)) - t*1.15)
      + 0.03*sin(dot(p, vec2(1.3, 0.9)) - t*1.8) + 0.012*sin(dot(p, vec2(-2.4, 1.6)) - t*2.6);

  d = max(d, dot(vec2(x8, p.y), vec2(0.751, -0.661)) - 0.784);

vec3 nObj(vec3 p){

bool marchOut(vec3 ro, vec3 rd, out float t){

  g.fillStyle = gr; g.fillRect(0, hz, w, h - hz);

    const y = hz + Math.pow(rnd(), 1.6) * (h - hz) * 0.8;
    const spread = 30 + (y - hz) * 0.5;

    g.fillStyle = cg; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }

  g.fillRect(0, h * 0.8, w, h * 0.2);
  for (let i = 0; i < 9; i++) { const x = 60 + i * 150; g.fillRect(x, h * 0.66, 14, h * 0.2); g.fillRect(x - 30, h * 0.66, 74, 10); }
  g.fillRect(0, h * 0.8 - 26, w, 12);
  g.fillRect(0, h * 0.8 - 90, w, 8);
  for (let i = 0; i < 9; i++) {
    const x = 67 + i * 150, y = h * 0.66;

    lg.addColorStop(0, 'rgba(255,220,160,.95)'); lg.addColorStop(0.2, 'rgba(255,190,120,.45)'); lg.addColorStop(1, 'rgba(255,170,100,0)');

async function startCam() {

    stopCam();
    stream = await navigator.mediaDevices.getUserMedia({

let ema = 16, slowFor = 0, pendingCapture = false;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  time += dt;
  seed = Math.random() * 97;
  if (S.spin && (S.mode === 'cam' || S.shape > 0)) spinA += dt * (S.mode === 'cam' ? 0.12 : 0.22);
  if (S.timeRun) {
    S.hour += dt * 0.3;
    if (S.hour > 22.5) S.hour = 4.0;
    syncTime();
  }
  ripples = ripples.filter(r => time - r.t0 < 9);
  updateSensors(dt);
  ema = lerp(ema, dt * 1000, 0.05);
  if (ema > 48 && dynScale > 0.62 && time > 2.5 && !window.__noAdapt) { slowFor += dt; if (slowFor > 1.5) { dynScale *= 0.85; slowFor = 0; } }
  else slowFor = 0;
  resize(false);
  computeLight();
  try {
    if (S.mode === 'anim') { if (S.shape === 0) renderWater(); else renderGlass(); }
    else if (camObj3D()) renderCamGlass();
    else renderFilter();
    bloomPass();
    composite();
  } catch (e) { console.error(e); return; }
  if (pendingCapture) {
    pendingCapture = false;
    canvas.toBlob(showPhoto, 'image/jpeg', 0.93);
  }
}

let activePane = 'scene', collapsed = false;
const bound = [];
function buildUI() {

  grip.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';

function setCollapsed(v) { collapsed = v; $('#sheet').classList.toggle('collapsed', v); requestAnimationFrame(measureSheet); }
function measureSheet() { document.documentElement.style.setProperty('--sheetH', $('#sheet').getBoundingClientRect().height + 'px'); }
function syncUI(except) {

}
function syncTime() {

function updateMeta() {

}
function setShape(v) {

    if (!wasWater) { cam.pitch = CAM_DEFAULT.water.pitch; cam.dist = CAM_DEFAULT.water.dist; }

}
function setMode(m) {

  S.mode = m;

    if (camObj3D()) { const m = SHAPES[CAM_OBJS[S.camObj].shape].mat; S.ior = MATS[m].ior; S.disp = MATS[m].disp; S.mat = m; if (S.tint === 1) S.tint = 0; }

function flipCam() { facing = facing === 'environment' ? 'user' : 'environment'; startCam(); }

let toastT = 0;

  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms || 2800);
}

/* ---------- photo ---------- */
let photoURL = null, photoBlob = null;
function showPhoto(blob) {
  if (!blob) { toast('Das Foto konnte nicht erstellt werden.'); return; }

$('#shutter').addEventListener('click', () => { pendingCapture = true; });
$('#closePhoto').addEventListener('click', () => { $('#photo').hidden = true; });
$('#sharePhoto').addEventListener('click', async () => {
  try { await navigator.share({ files: [new File([photoBlob], $('#dlPhoto').download, { type: 'image/jpeg' })], title: 'Refraktor' }); }
  catch (e) { if (e && e.name !== 'AbortError') toast('Teilen wird hier nicht unterstützt. Nutze Download oder langes Drücken aufs Bild.'); }

$('#flip').addEventListener('click', flipCam);
$('#loadImg').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];

  const img = new Image();

$('#mAnim').addEventListener('click', () => setMode('anim'));
$('#mCam').addEventListener('click', () => setMode('cam'));
$('#hideUI').addEventListener('click', () => { document.body.classList.add('noui'); $('#restore').hidden = false; });

/* ---------- device sensors ---------- */
function screenTilt() {
  const a = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  const b = sens.beta, g = sens.gamma;
  if (a === 90) return [b, -g];
  if (a === -90 || a === 270) return [-b, g];
  if (a === 180) return [-g, -b];
  return [g, b];
}
function onOrientation(e) {

}
function onMotion(e) {

  if (!a || a.x === null) return;
  sens.ax = a.x; sens.az = a.z;
  const m = Math.hypot(a.x, a.y, a.z);
  const now = performance.now();
  if (S.motion && m > 12 && now - sens.lastShake > 110) { sens.lastShake = now; shakeRipple(Math.min(m / 20, 1.6)); }
}
addEventListener('deviceorientation', onOrientation);
addEventListener('deviceorientationabsolute', onOrientation);
addEventListener('devicemotion', onMotion);
async function enableMotion() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== 'granted') throw new Error('denied');
    }
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      await DeviceMotionEvent.requestPermission().catch(() => 'denied');
    }
    sens.ref = null;
    S.motion = true;
    toast('Bewegungssensoren sind aktiv. Neige oder schüttle das Handy.');
    setTimeout(() => { if (S.motion && !sens.hasOri) toast('Dieses Gerät oder dieser Browser liefert keine Neigungsdaten.', 4200); }, 2000);
  } catch (err) {
    S.motion = false;
    toast('Zugriff auf die Bewegungssensoren wurde nicht erlaubt. Lade die Seite neu und tippe erneut auf den Schalter.', 5200);
  }
  syncUI();
}
function enableRealSun() {
  S.realSun = false;
  if (!navigator.geolocation) { toast('Dieser Browser kann den Standort nicht bestimmen.'); return; }
  toast('Standort wird bestimmt …');
  navigator.geolocation.getCurrentPosition(pos => {
    geo = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    S.realSun = true; S.timeRun = false;
    const sp = solarPosition(new Date(), geo.lat, geo.lon);
    toast('Echte Sonne: ' + (sp.el >= 0 ? '+' : '−') + Math.abs(sp.el).toFixed(1) + '° über dem Horizont, Richtung ' + compassName(sp.az / deg) + '.', 4200);
    syncUI();
  }, () => {
    S.realSun = false;
    toast('Standort nicht verfügbar. Erlaube den Zugriff für diese Seite in den Safari-Einstellungen.', 5200);
    syncUI();

}
function compassName(a) {
  const n = ['N', 'NO', 'O', 'SO', 'S', 'SW', 'W', 'NW'];
  return n[Math.round((((a % 360) + 360) % 360) / 45) % 8];
}
function sensorText() {
  const parts = [];
  if (S.motion) {
    if (sens.hasOri) {
      const [tx, ty] = screenTilt();
      parts.push('Neigung ' + Math.round(tx) + '° / ' + Math.round(ty) + '°');
      parts.push(sens.heading !== null ? 'Kompass ' + Math.round(sens.heading) + '° ' + compassName(sens.heading) : 'kein Kompass');
    } else parts.push('Warte auf Sensordaten …');
  }
  if (S.realSun && geo) {
    const sp = solarPosition(new Date(), geo.lat, geo.lon);
    parts.push(Math.abs(geo.lat).toFixed(2) + '°' + (geo.lat >= 0 ? 'N' : 'S') + ' ' + Math.abs(geo.lon).toFixed(2) + '°' + (geo.lon >= 0 ? 'O' : 'W'));
    parts.push('Sonne ' + (sp.el >= 0 ? '+' : '−') + Math.abs(sp.el).toFixed(1) + '°, ' + Math.round(((sp.az / deg) + 360) % 360) + '° ' + compassName(sp.az / deg));

function updateSensors(dt) {
  // smoothed tilt relative to the reference pose

    if (!sens.ref) sens.ref = [a, b];
    tx = clamp(a - sens.ref[0], -50, 50);
    ty = clamp(b - sens.ref[1], -50, 50);
  }
  const k = Math.min(1, dt * 9);
  sens.sx += (tx - sens.sx) * k;
  sens.sy += (ty - sens.sy) * k;

  const f = S.motion ? [-sens.ax * 0.05, sens.az * 0.05] : [0, 0];

    slosh.a[i] = clamp(slosh.a[i] + slosh.v[i] * dt, -0.6, 0.6);
  }
  const cb = camBasis([0, 0, 0], cam);
  const r = norm3([cb.r[0], 0, cb.r[2]]), fw = norm3([cb.f[0], 0, cb.f[2]]);
  slosh.ax.set([r[0], r[2], fw[0], fw[2]]);

    const d = new Date();
    S.hour = d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
  }
  if (S.motion || S.realSun) {

function shakeRipple(amp) {

    const a = 1 + Math.random() * 7, b = (Math.random() - 0.5) * 7;
    ripples.push({ x: fw[0] * a + r[0] * b, z: fw[2] * a + r[2] * b, t0: time, amp });

    const asp = innerWidth / innerHeight, K = 3 / S.scale;
    ripples.push({ x: (Math.random() - 0.5) * asp * K, z: (Math.random() - 0.5) * K, t0: time, amp });

/* ---------- pointer interaction ---------- */
const ptrs = new Map();
let drag = null, pinch0 = 0, dist0 = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), moved: false };
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = curCam().dist; if (drag) drag.moved = true; }
});
canvas.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch0 > 0) {
      if (S.mode === 'anim') cam.dist = clamp(dist0 * pinch0 / d, 2.6, 16);
      else if (camObj3D()) camC.dist = clamp(dist0 * pinch0 / d, camMinDist(), 14);
    }
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 7) drag.moved = true;
  drag.x = e.clientX; drag.y = e.clientY;
  if (!drag.moved) return;
  if (S.mode === 'anim') {
    cam.yaw -= dx * 0.006;
    cam.pitch = clamp(cam.pitch + dy * 0.004, 2 * deg, 80 * deg);
  } else if (camObj3D()) {
    camC.yaw -= dx * 0.006;
    camC.pitch = clamp(camC.pitch + dy * 0.006, -85 * deg, 85 * deg);
  }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size === 0) {
    if (drag && !drag.moved && performance.now() - drag.t < 450) tap(e.clientX, e.clientY);
    drag = null; pinch0 = 0;
  }
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (S.mode === 'anim') cam.dist = clamp(cam.dist * Math.exp(e.deltaY * 0.0012), 2.6, 16);
  else if (camObj3D()) camC.dist = clamp(camC.dist * Math.exp(e.deltaY * 0.0012), camMinDist(), 14);

}, { passive: false });
function addRipple(x, z) {

}
function tap(cx, cy) {

    const cb = camBasis([0, 0, 0]);
    const k = fovK();
    const ux = (cx - innerWidth / 2) / innerHeight * k, uy = (innerHeight / 2 - cy) / innerHeight * k;
    const rd = norm3([cb.r[0] * ux + cb.u[0] * uy + cb.f[0], cb.r[1] * ux + cb.u[1] * uy + cb.f[1], cb.r[2] * ux + cb.u[2] * uy + cb.f[2]]);
    if (rd[1] >= -0.01) return;
    const t = -cb.pos[1] / rd[1];
    addRipple(cb.pos[0] + rd[0] * t, cb.pos[2] + rd[2] * t);
  } else {
    if (camObj3D() || CAM_OBJS[S.camObj].struct !== 0) return;
    const asp = innerWidth / innerHeight, K = 3 / S.scale;
    addRipple((cx / innerWidth - 0.5) * asp * K, (0.5 - cy / innerHeight) * K);

addEventListener('resize', () => { requestAnimationFrame(measureSheet); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (src.kind === 'video') { stopCam(); src.resume = true; } }
  else if (src.resume && S.mode === 'cam') { src.resume = false; startCam(); }
});
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); toast('Die Grafik wurde vom System zurückgesetzt. Bitte Seite neu laden.', 8000); });

/* ---------- boot ---------- */
buildUI();
if (coarse) setCollapsed(true);
syncUI();
resize(true);
computeLight();
if (location.hash === '#kamera') setMode('cam');
requestAnimationFrame(t => { lastT = t; frame(t); });
setTimeout(() => toast(coarse ? 'Ziehen zum Drehen · Pinch zum Zoomen' : 'Ziehen zum Drehen · Mausrad zum Zoomen'), 600);
window.__refraktor = { S, cam, camC, setMode, setShape, syncUI, get time() { return time; }, };
})();
